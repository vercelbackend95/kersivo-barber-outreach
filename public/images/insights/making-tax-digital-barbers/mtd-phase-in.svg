<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">Making Tax Digital Income Tax thresholds phase in 2026 to 2028</title><desc id="d">MTD for Income Tax applies from April 2026 to those with 2024/25 qualifying income over £50,000; from April 2027 to those over £30,000 in 2025/26; and from April 2028 to those over £20,000 in 2026/27.</desc>
<rect width="1200" height="750" rx="24" fill="#131518"/><text x="54" y="59" fill="#ff3434" font-family="Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="3">KERSIVO INSIGHTS / HMRC MTD TIMELINE</text>
<text x="54" y="126" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="750">Which threshold applies — and when?</text>
<text x="54" y="166" fill="#bac1c8" font-family="Arial,sans-serif" font-size="21">Based on gross qualifying income from an earlier tax year.</text>
<rect x="54" y="226" width="1092" height="107" fill="#f5f4f0" rx="13"/><text x="81" y="269" font-family="Arial,sans-serif" font-size="23" font-weight="740" fill="#22262a">6 APR 2026</text><text x="81" y="304" font-family="Arial,sans-serif" font-size="20" fill="#5f646b">2024/25 return as the source</text><text x="783" y="293" font-family="Arial,sans-serif" font-size="53" font-weight="760" fill="#20252a">&gt; £50,000</text><rect x="54" y="350" width="1092" height="107" fill="#fbe5e5" rx="13"/><text x="81" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="740" fill="#22262a">6 APR 2027</text><text x="81" y="428" font-family="Arial,sans-serif" font-size="20" fill="#5f646b">2025/26 return as the source</text><text x="783" y="417" font-family="Arial,sans-serif" font-size="53" font-weight="760" fill="#c7252c">&gt; £30,000</text><rect x="54" y="474" width="1092" height="107" fill="#f5f4f0" rx="13"/><text x="81" y="517" font-family="Arial,sans-serif" font-size="23" font-weight="740" fill="#22262a">6 APR 2028</text><text x="81" y="552" font-family="Arial,sans-serif" font-size="20" fill="#5f646b">2026/27 return as the source</text><text x="783" y="541" font-family="Arial,sans-serif" font-size="53" font-weight="760" fill="#20252a">&gt; £20,000</text>
<rect x="54" y="639" width="1092" height="70" rx="13" fill="#2b2e32"/><text x="82" y="684" font-family="Arial,sans-serif" font-size="24" font-weight="740" fill="#fff">Exactly on the line does not mean over the line.</text><text x="54" y="735" fill="#b5bdc6" font-family="Arial,sans-serif" font-size="16">Check exemptions, business status, HMRC notices and your actual Self Assessment entries.</text></svg>