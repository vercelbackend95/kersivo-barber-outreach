<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Making Tax Digital tests turnover rather than profit</title><desc id="d">A hypothetical chair renter makes £38,000 in self-employed takings, pays £9,000 chair rent and £7,000 other costs and retains £22,000 profit. The £38,000 figure exceeds the 2027 £30,000 MTD qualifying income threshold.</desc>
<rect width="1200" height="720" rx="24" fill="#131518"/><text x="54" y="59" fill="#ff3434" font-family="Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="3">KERSIVO INSIGHTS / UK BARBER FINANCES</text><text x="54" y="122" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="750">MTD checks takings — not take-home.</text><text x="54" y="168" fill="#c1c7cf" font-family="Arial,sans-serif" font-size="21">One invented chair renter · 2025/26 tax-year example</text>
<rect x="54" y="217" width="1092" height="102" rx="14" fill="#f5f3ef"/><text x="87" y="267" font-family="Arial,sans-serif" font-size="24" fill="#414750">Qualifying self-employment takings</text><text x="842" y="277" font-family="Arial,sans-serif" font-size="57" font-weight="780" fill="#be2431">£38,000</text>
<rect x="54" y="342" width="529" height="132" rx="14" fill="#f5f3ef"/><text x="87" y="393" font-family="Arial,sans-serif" font-size="22" fill="#414750">Chair rent</text><text x="87" y="446" font-family="Arial,sans-serif" font-size="47" font-weight="740" fill="#30343a">−£9,000</text>
<rect x="616" y="342" width="530" height="132" rx="14" fill="#f5f3ef"/><text x="648" y="393" font-family="Arial,sans-serif" font-size="22" fill="#414750">Other costs</text><text x="648" y="446" font-family="Arial,sans-serif" font-size="47" font-weight="740" fill="#30343a">−£7,000</text>
<rect x="54" y="499" width="1092" height="91" rx="14" fill="#2a2e33"/><text x="86" y="554" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="740">Remaining profit:</text><text x="811" y="556" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="770">£22,000</text>
<text x="54" y="648" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="740">£38,000 is over the £30,000 qualifying-income threshold.</text><text x="54" y="692" fill="#adb6be" font-family="Arial,sans-serif" font-size="17">Illustrative facts; eligibility, status and exemptions must be checked individually.</text></svg>