<title id="t">The same card fee weighs more on lower-priced services</title><desc id="d">At the illustrative online rate of 1.5 percent plus twenty pence, the fee share is 3.17 percent on a twelve-pound service, 2.30 percent on twenty-five pounds and 2.00 percent on forty pounds.</desc>
<rect width="1200" height="650" fill="#f2f0ea"/><rect x="47" y="45" width="1106" height="556" rx="16" fill="#fffdfa" stroke="#dad6d0" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="92" y="107" fill="#a82533" font-size="17" font-weight="850" letter-spacing="4">EXAMPLE / 1.5% + 20p</text>
<text x="92" y="166" fill="#181b20" font-size="45" font-weight="800" letter-spacing="-1.5">One rate. Different effective cost.</text>
<text x="92" y="205" fill="#5e646b" font-size="22">Card fee as a share of the service price</text>
<text x="92" y="283" fill="#24272b" font-size="26" font-weight="800">£12 haircut</text><rect x="340" y="249" width="615" height="51" rx="5" fill="#ece7df"/><rect x="340" y="249" width="615" height="51" rx="5" fill="#bd273a"/><text x="1112" y="286" fill="#212429" text-anchor="end" font-size="36" font-weight="800">3.17%</text>
<text x="92" y="388" fill="#24272b" font-size="26" font-weight="800">£25 haircut</text><rect x="340" y="353" width="615" height="51" rx="5" fill="#ece7df"/><rect x="340" y="353" width="446" height="51" rx="5" fill="#6c7a85"/><text x="1112" y="391" fill="#212429" text-anchor="end" font-size="36" font-weight="800">2.30%</text>
<text x="92" y="494" fill="#24272b" font-size="26" font-weight="800">£40 haircut</text><rect x="340" y="459" width="615" height="51" rx="5" fill="#ece7df"/><rect x="340" y="459" width="388" height="51" rx="5" fill="#6c7a85"/><text x="1112" y="497" fill="#212429" text-anchor="end" font-size="36" font-weight="800">2.00%</text>
