<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">What another barber chair contributes before fixed overhead</title><desc id="desc">Model turnover for 2, 4 and 6 chairs is £90,000, £180,000 and £270,000, while contribution before shop fixed overhead is £66,247, £114,142 and £162,036. These amounts are not owner pay.</desc>
<rect width="1200" height="750" rx="24" fill="#141519"/>
<text x="56" y="61" fill="#ff3434" font-family="Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="3">KERSIVO INSIGHTS / CHAIR ECONOMICS</text>
<text x="56" y="125" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="760">More chairs are not more take-home.</text>
<text x="56" y="167" fill="#bcc3ca" font-family="Arial,sans-serif" font-size="21">Illustrative contribution BEFORE premises, utilities, other overhead and tax</text>
<text x="56" y="219" fill="#c8ced2" font-family="Arial,sans-serif" font-size="19" font-weight="750">MODEL CONTRIBUTION, NOT OWNER INCOME</text>
<line x1="266" y1="282" x2="1125" y2="282" stroke="#42474c" stroke-dasharray="6 11"/>
<line x1="266" y1="410" x2="1125" y2="410" stroke="#42474c" stroke-dasharray="6 11"/>
<line x1="266" y1="538" x2="1125" y2="538" stroke="#42474c" stroke-dasharray="6 11"/>
<text x="55" y="321" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="740">2 CHAIRS</text><rect x="266" y="275" width="250" height="67" fill="#9da5ac" rx="9"/><text x="538" y="320" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="750">£66,247</text><text x="266" y="372" fill="#b4bbc3" font-family="Arial,sans-serif" font-size="17">£90,000 sales excluding VAT</text><text x="55" y="448" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="740">4 CHAIRS</text><rect x="266" y="402" width="431" height="67" fill="#ff3038" rx="9"/><text x="719" y="447" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="750">£114,142</text><text x="266" y="499" fill="#b4bbc3" font-family="Arial,sans-serif" font-size="17">£180,000 sales excluding VAT</text><text x="55" y="575" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="740">6 CHAIRS</text><rect x="266" y="529" width="612" height="67" fill="#9da5ac" rx="9"/><text x="900" y="574" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="750">£162,036</text><text x="266" y="626" fill="#b4bbc3" font-family="Arial,sans-serif" font-size="17">£270,000 sales excluding VAT</text>
<line x1="56" y1="660" x2="1144" y2="660" stroke="#4f555d"/>
<text x="56" y="694" fill="#d8dce0" font-family="Arial,sans-serif" font-size="17">One working owner + employed chairs, £45k annual sales/chair. Same hypothetical cost ratios.</text>
<text x="56" y="722" fill="#aeb5bd" font-family="Arial,sans-serif" font-size="16">Bigger shops also need more rent, rates, cover and management; those costs are NOT deducted here.</text>
</svg>