<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="t d"><title id="t">Unfair dismissal qualifying period changes in 2027</title><desc id="d">Before 1 January 2027, ordinary unfair dismissal protection normally requires two years of service. From 1 January 2027, it generally requires six months, based on the effective termination date. Some claims have day-one protection.</desc><rect width="1200" height="735" rx="24" fill="#131417"/><text x="52" y="61" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ff3434" letter-spacing="3">KERSIVO INSIGHTS / UK EMPLOYMENT</text><text x="52" y="130" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">2 years becomes 6 months.</text><text x="52" y="172" font-family="Arial,sans-serif" font-size="20" fill="#bcc1c8">Ordinary unfair dismissal: England, Wales and Scotland</text><rect x="52" y="227" width="531" height="290" rx="16" fill="#f8f7f4"/><rect x="615" y="227" width="531" height="290" rx="16" fill="#f8f7f4"/><text x="80" y="283" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#545a60">UNTIL 31 DECEMBER 2026</text><text x="642" y="283" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#545a60">FROM 1 JANUARY 2027</text><text x="80" y="385" font-family="Arial,sans-serif" font-size="85" font-weight="700" fill="#22272b">2 years</text><text x="642" y="385" font-family="Arial,sans-serif" font-size="80" font-weight="700" fill="#d12c33">6 months</text><line x1="80" y1="417" x2="555" y2="417" stroke="#c9cac9"/><line x1="642" y1="417" x2="1116" y2="417" stroke="#c9cac9"/><text x="80" y="471" font-family="Arial,sans-serif" font-size="20" fill="#434a51">Normal qualifying period</text><text x="642" y="471" font-family="Arial,sans-serif" font-size="20" fill="#434a51">Normal qualifying period</text><rect x="52" y="561" width="1094" height="99" rx="14" fill="#282b30"/><text x="80" y="602" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">What controls the change?</text><text x="80" y="636" font-family="Arial,sans-serif" font-size="19" fill="#c6cbd0">Effective termination date, service and statutory notice.</text><text x="52" y="704" font-family="Arial,sans-serif" font-size="17" fill="#b6bdc5">Some day-one claims remain. Illustration only; check official law and take advice before dismissals.</text></svg>