<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d"><title id="t">Five practical employer checks before January 2027</title><desc id="d">Check employee service dates, statutory notice, probation arrangements, performance records and fair dismissal process. The graphic is general guidance rather than legal advice.</desc><rect width="1200" height="730" rx="24" fill="#131417"/><text x="53" y="62" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ff3434" letter-spacing="3">KERSIVO INSIGHTS / OWNER CHECKLIST</text><text x="53" y="129" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#fff">Before a dismissal decision</text><text x="53" y="172" font-family="Arial,sans-serif" font-size="21" fill="#bac1c7">A practical record-keeping routine for a small employed team</text><rect x="53" y="205" width="1093" height="72" rx="11" fill="#f7f6f3"/><text x="76" y="254" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#c62732">01</text><text x="171" y="250" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">SERVICE DATES</text><text x="535" y="250" font-family="Arial,sans-serif" font-size="19" fill="#4d535b">Know when each employee reaches 6 months</text><rect x="53" y="290" width="1093" height="72" rx="11" fill="#e7e8e6"/><text x="76" y="339" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#c62732">02</text><text x="171" y="335" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">STATUTORY NOTICE</text><text x="535" y="335" font-family="Arial,sans-serif" font-size="19" fill="#4d535b">Count service correctly before decisions</text><rect x="53" y="375" width="1093" height="72" rx="11" fill="#f7f6f3"/><text x="76" y="424" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#c62732">03</text><text x="171" y="420" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">PROBATION</text><text x="535" y="420" font-family="Arial,sans-serif" font-size="19" fill="#4d535b">Set clear check-ins and expectations</text><rect x="53" y="460" width="1093" height="72" rx="11" fill="#e7e8e6"/><text x="76" y="509" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#c62732">04</text><text x="171" y="505" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">RECORDS</text><text x="535" y="505" font-family="Arial,sans-serif" font-size="19" fill="#4d535b">Date important feedback and concerns</text><rect x="53" y="545" width="1093" height="72" rx="11" fill="#f7f6f3"/><text x="76" y="594" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#c62732">05</text><text x="171" y="590" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">FAIR PROCESS</text><text x="535" y="590" font-family="Arial,sans-serif" font-size="19" fill="#4d535b">Investigate, hear, decide, allow appeal</text><text x="53" y="681" font-family="Arial,sans-serif" font-size="18" fill="#c4c9cf">Not legal advice. Follow Acas procedure and seek specialist advice for individual dismissals.</text></svg>