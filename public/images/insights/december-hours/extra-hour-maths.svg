<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">The extra hour test: how much does an extra December barber hour contribute?</title>
<desc id="desc">Illustrative examples based on the article's assumptions. Extra cost: fifteen pounds for an hour. Each genuinely additional haircut contributes nineteen pounds. One extra cut adds four pounds, one and a half adds thirteen pounds fifty, and two add twenty-three pounds. If one of two cuts only moves from a daytime slot, net new contribution is four pounds.</desc>
<rect width="1200" height="730" fill="#11151b"/>
<rect x="0" y="0" width="1200" height="8" fill="#de2b41"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="87" fill="#ed6b7a" font-size="18" font-weight="800" letter-spacing="4">KERSIVO / INSIGHTS / DECEMBER PLANNING</text>
<text x="65" y="155" fill="#f6f3ed" font-size="53" font-weight="850" letter-spacing="-1.5">Does the extra hour pay?</text>
<text x="65" y="207" fill="#b8c0c8" font-size="24">Illustrative: £15 extra cost / £19 contribution per genuinely new cut.</text>
<rect x="65" y="251" width="327" height="273" rx="10" fill="#282e38"/>
<rect x="436" y="251" width="327" height="273" rx="10" fill="#282e38"/>
<rect x="807" y="251" width="327" height="273" rx="10" fill="#282e38"/>
<g fill="#f3f0eb" font-size="25" font-weight="800"><text x="89" y="301">1 extra cut</text><text x="460" y="301">1.5 extra cuts</text><text x="831" y="301">2 extra cuts</text></g>
<g fill="#ed7180" font-size="72" font-weight="900" letter-spacing="-1.5"><text x="88" y="404">+£4</text><text x="459" y="404">+£13.50</text><text x="830" y="404">+£23</text></g>
<g fill="#b6bfc9" font-size="19"><text x="89" y="459">1 × £19 − £15</text><text x="460" y="459">1.5 × £19 − £15</text><text x="831" y="459">2 × £19 − £15</text></g>
<rect x="65" y="551" width="1069" height="111" rx="7" fill="#383039"/>
<rect x="65" y="551" width="7" height="111" rx="3" fill="#eb6073"/>
<text x="90" y="595" fill="#f6f3ed" font-size="26" font-weight="800">The displacement trap</text>
<text x="90" y="630" fill="#e2d2d5" font-size="21">Two booked cuts, but one moved from 5pm? Only one is new: £4, not £23.</text>
<text x="65" y="699" fill="#a5adb8" font-size="16" letter-spacing=".1">BREAK-EVEN = EXTRA HOURLY COST ÷ CONTRIBUTION PER GENUINELY ADDITIONAL CUT</text>
</g>
</svg>