<rect x="908" y="274" width="164" height="274" rx="7" fill="#ff2727"/>
<text x="249" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-weight="750" font-size="37" fill="#f7f7f4">7</text>
<text x="496" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-weight="750" font-size="37" fill="#f7f7f4">19</text>
