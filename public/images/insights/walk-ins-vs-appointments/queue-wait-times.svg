<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">When barbers get busier, the queue gets much longer</title><desc id="desc">Bar chart for a hypothetical two-barber walk-in shop. Mean waiting in queue for 20-minute cuts and utilisation of 50, 70, 80, 90 percent is 7, 19, 36, 85 minutes respectively.</desc>
<rect width="1200" height="740" rx="24" fill="#131416"/>
<text x="54" y="59" fill="#ff3838" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" font-weight="800">KERSIVO INSIGHTS  /  QUEUE ECONOMICS</text>
<text x="54" y="125" fill="#f7f7f4" font-family="Arial,sans-serif" font-size="46" font-weight="750">When a busy shop becomes a long queue</text>
<text x="54" y="169" fill="#bfc2c5" font-family="Arial,sans-serif" font-size="21">Modelled average wait before reaching the barber chair</text>
<text x="54" y="218" fill="#dadde0" font-family="Arial,sans-serif" font-size="17" font-weight="700">MINUTES WAITING IN QUEUE</text>
