<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">A gift voucher's money and haircut happen at different times</title><desc id="d">Example of a thirty-pound voucher: at sale cash arrives and a service obligation begins, VAT may be due for qualifying VAT-registered shops, and at redemption the haircut is delivered; later follow-up shows whether the recipient becomes a returning client.</desc><rect width="1200" height="690" fill="#f2f0ea"/><rect x="44" y="45" width="1112" height="600" rx="14" fill="#fffdf8" stroke="#d8d2c9" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="87" y="110" fill="#b3273a" font-size="19" letter-spacing="3" font-weight="800">ILLUSTRATIVE / £30 VOUCHER</text><text x="86" y="172" fill="#202229" font-size="47" font-weight="800" letter-spacing="-2">Three moments. Different outcomes.</text><text x="86" y="214" fill="#6c7076" font-size="23">The shop receives cash before it delivers the service.</text>
<path d="M154 342H1036" stroke="#c3c7cb" stroke-width="7"/><circle cx="171" cy="342" r="24" fill="#c32b40"/><circle cx="598" cy="342" r="24" fill="#c32b40"/><circle cx="1020" cy="342" r="24" fill="#c32b40"/>
<text x="87" y="299" fill="#a42a39" font-size="20" font-weight="800" letter-spacing="2">01 / SOLD</text><text x="460" y="299" fill="#a42a39" font-size="20" font-weight="800" letter-spacing="2">02 / REDEEMED</text><text x="876" y="299" fill="#a42a39" font-size="20" font-weight="800" letter-spacing="2">03 / FOLLOW-UP</text>
<text x="86" y="429" fill="#1e2026" font-size="33" font-weight="800">£30 cash arrives</text><text x="86" y="468" fill="#555c63" font-size="21">Service still owed</text><text x="86" y="500" fill="#555c63" font-size="21">VAT may be due now*</text>
<text x="460" y="429" fill="#1e2026" font-size="33" font-weight="800">Cut delivered</text><text x="460" y="468" fill="#555c63" font-size="21">Obligation discharged</text><text x="460" y="500" fill="#555c63" font-size="21">Barber time used</text>
<text x="874" y="429" fill="#1e2026" font-size="33" font-weight="800">Did they return?</text><text x="874" y="468" fill="#555c63" font-size="21">Track their next</text><text x="874" y="500" fill="#555c63" font-size="21">paid booking</text>
<path d="M87 555H1111" stroke="#dfd9d1"/><text x="87" y="592" fill="#60656a" font-size="18">*If VAT-registered and the voucher is single-purpose. Accounting treatment varies.</text></g></svg>