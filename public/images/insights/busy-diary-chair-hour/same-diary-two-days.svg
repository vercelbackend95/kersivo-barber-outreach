<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Two equally full diaries, two different results</title><desc id="d">An eight-hour day with 475 booked minutes: Day A makes £246 revenue and £231.01 contribution; Day B makes £274 revenue and £256.79 contribution, a £25.78 difference.</desc><rect width="1200" height="720" rx="24" fill="#141518"/><text x="58" y="60" font-family="Arial,sans-serif" font-size="17" font-weight="750" letter-spacing="3" fill="#FF3232">KERSIVO / BUSINESS &amp; PROFIT</text><text x="58" y="125" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Same diary. Different contribution.</text><text x="58" y="167" font-family="Arial,sans-serif" font-size="21" fill="#b5bbc0">Both days use 475 of 480 available chair-minutes.</text>
<rect x="58" y="220" rx="18" width="519" height="295" fill="#f4f3ef"/><rect x="624" y="220" rx="18" width="519" height="295" fill="#f4f3ef"/>
<text x="90" y="267" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6d7077">DAY A · 11 SERVICES</text><text x="656" y="267" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6d7077">DAY B · 12 SERVICES</text>
<text x="90" y="345" font-family="Arial,sans-serif" font-size="46" font-weight="750" fill="#202125">£231.01</text><text x="656" y="345" font-family="Arial,sans-serif" font-size="46" font-weight="750" fill="#c72730">£256.79</text>
<text x="90" y="382" font-family="Arial,sans-serif" font-size="19" fill="#4c5459">Contribution, before fixed costs</text><text x="656" y="382" font-family="Arial,sans-serif" font-size="19" fill="#4c5459">Contribution, before fixed costs</text>
<line x1="90" y1="425" x2="545" y2="425" stroke="#c8c8c7"/><line x1="656" y1="425" x2="1110" y2="425" stroke="#c8c8c7"/>
<text x="90" y="467" font-family="Arial,sans-serif" font-size="19" fill="#41464c">Revenue: £246</text><text x="656" y="467" font-family="Arial,sans-serif" font-size="19" fill="#41464c">Revenue: £274</text>
<rect x="58" y="551" width="1085" height="91" rx="14" fill="#2a2d32"/><text x="88" y="607" font-family="Arial,sans-serif" font-size="26" font-weight="750" fill="#fff">DAY B ADDS <tspan fill="#ff4141">£25.78</tspan> CONTRIBUTION</text>
<text x="58" y="685" font-family="Arial,sans-serif" font-size="17" fill="#b8bdc3">Hypothetical service mix and variable costs, from the approved Notion worked example.</text></svg>