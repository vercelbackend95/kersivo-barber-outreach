<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d"><title id="t">When does the tenth free cut break even?</title><desc id="d">Without a stamp card ten paid cuts yield £190 contribution, whereas nine paid and one free cut yields £168. The illustrative scheme needs about thirteen percent more total visits to match the same contribution.</desc>
<rect width="1200" height="730" rx="24" fill="#111317"/><text x="54" y="57" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#ff3232">KERSIVO INSIGHTS / THE TEN-CUT CARD</text>
<text x="54" y="128" font-family="Arial,sans-serif" font-size="47" font-weight="750" fill="#fff">Nine paid. One free. Does it pay?</text><text x="54" y="171" font-family="Arial,sans-serif" font-size="21" fill="#b9bfc6">A £22 haircut with approximately £3 variable costs.</text>
<circle cx="105" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="105" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">1</text><circle cx="215" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="215" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">2</text><circle cx="325" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="325" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">3</text><circle cx="435" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="435" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">4</text><circle cx="545" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="545" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">5</text><circle cx="655" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="655" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">6</text><circle cx="765" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="765" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">7</text><circle cx="875" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="875" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">8</text><circle cx="985" cy="296" r="37" fill="#faf9f5" stroke="#62696f" stroke-width="3"/><text x="985" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3d4449">9</text><circle cx="1095" cy="296" r="37" fill="#f7dcdc" stroke="#df323b" stroke-width="3"/><text x="1095" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#a3242d">FREE</text>
<rect x="55" y="382" width="515" height="177" fill="#f4f2ef" rx="15"/><rect x="630" y="382" width="515" height="177" fill="#f4f2ef" rx="15"/>
<text x="89" y="429" font-family="Arial,sans-serif" font-size="23" fill="#4c5359">10 paid visits</text><text x="667" y="429" font-family="Arial,sans-serif" font-size="23" fill="#4c5359">9 paid + 1 free</text>
<text x="89" y="521" font-family="Arial,sans-serif" font-size="73" font-weight="800" fill="#24272b">£190</text><text x="667" y="521" font-family="Arial,sans-serif" font-size="73" font-weight="800" fill="#c12732">£168</text>
<rect x="55" y="593" width="1090" height="77" fill="#25282e" rx="12"/><text x="90" y="642" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#fff">Break-even requires <tspan fill="#ff4141">~13.1% more visits</tspan></text>
<text x="54" y="703" font-family="Arial,sans-serif" font-size="17" fill="#aab0b7">Hypothetical cycle average, not a forecast. Any actual uplift must be measured.</text></svg>