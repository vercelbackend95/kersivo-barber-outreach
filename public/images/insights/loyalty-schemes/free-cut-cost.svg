<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="t d"><title id="t">What does a free haircut cost?</title><desc id="d">A free cut that replaces a paying visit costs £22 in the example. One filling an otherwise empty appointment slot costs about £3 in variable expenses.</desc>
<rect width="1200" height="710" fill="#111317" rx="24"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#ff3232">KERSIVO INSIGHTS / LOYALTY ECONOMICS</text>
<text x="54" y="130" font-family="Arial,sans-serif" font-size="48" font-weight="750" fill="#fff">What does a "free" cut cost?</text><text x="54" y="171" font-family="Arial,sans-serif" font-size="22" fill="#bec3c9">It depends on what the client would have done otherwise.</text>
<rect x="54" y="215" width="530" height="347" rx="17" fill="#f5f3ef"/><rect x="617" y="215" width="529" height="347" rx="17" fill="#f5f3ef"/>
<text x="86" y="262" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9b252c">SCENARIO A</text><text x="649" y="262" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9b252c">SCENARIO B</text>
<text x="86" y="326" font-family="Arial,sans-serif" font-size="30" font-weight="750" fill="#1d2025">Replaces a paid cut</text><text x="649" y="326" font-family="Arial,sans-serif" font-size="30" font-weight="750" fill="#1d2025">Fills a quiet slot</text>
<text x="86" y="424" font-family="Arial,sans-serif" font-size="84" font-weight="780" fill="#b9232f">£22</text><text x="649" y="424" font-family="Arial,sans-serif" font-size="84" font-weight="780" fill="#39745a">~£3</text>
<text x="86" y="480" font-family="Arial,sans-serif" font-size="22" fill="#414850">A paid visit is lost</text><text x="86" y="512" font-family="Arial,sans-serif" font-size="22" fill="#414850">plus free-cut costs</text>
<text x="649" y="480" font-family="Arial,sans-serif" font-size="22" fill="#414850">Variable service cost</text><text x="649" y="512" font-family="Arial,sans-serif" font-size="22" fill="#414850">with no paid cut lost</text>
<text x="54" y="616" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f3f4f6">A full diary can make the free cut more expensive.</text>
<text x="54" y="658" font-family="Arial,sans-serif" font-size="19" fill="#b4b9c1">Illustrative £22 price / ~£3 variable cost. Not real shop data.</text></svg>