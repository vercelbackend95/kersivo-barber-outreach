<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Illustrative comparison of review requests</title><desc id="d">Illustrative 120 cuts a week. At a 1 in 25 response rate: 4.8 reviews per week. At a 1 in 200 response rate: 0.6 reviews per week. Assumed example, not survey data.</desc><rect width="1200" height="590" fill="#e7e4dc"/><rect x="54" y="54" width="1092" height="482" rx="14" fill="#f8f6f1"/><text x="94" y="111" fill="#a12231" font-size="16" font-family="Arial,Helvetica,sans-serif" letter-spacing="3" font-weight="800">ILLUSTRATIVE EXAMPLE / 120 CUTS PER WEEK</text><text x="94" y="172" fill="#202328" font-size="44" font-family="Arial,Helvetica,sans-serif" font-weight="800">The impact of simply asking.</text><text x="94" y="241" fill="#51545a" font-size="20" font-family="Arial,Helvetica,sans-serif">If 1 in 25 clients leaves a review when asked</text><rect x="94" y="264" width="834" height="52" rx="4" fill="#be2536"/><text x="952" y="303" fill="#202328" font-size="46" font-family="Arial,Helvetica,sans-serif" font-weight="800">4.8</text><text x="1086" y="302" fill="#555b61" font-size="16" font-family="Arial,Helvetica,sans-serif">/ week</text><text x="94" y="369" fill="#51545a" font-size="20" font-family="Arial,Helvetica,sans-serif">If 1 in 200 clients leaves one without being asked</text><rect x="94" y="392" width="104" height="52" rx="4" fill="#555d67"/><text x="952" y="431" fill="#202328" font-size="46" font-family="Arial,Helvetica,sans-serif" font-weight="800">0.6</text><text x="1086" y="430" fill="#555b61" font-size="16" font-family="Arial,Helvetica,sans-serif">/ week</text><path d="M94 469H1093" stroke="#d7d4cd"/><text x="94" y="499" fill="#5a6066" font-size="17" font-family="Arial,Helvetica,sans-serif">ASSUMED RESPONSE RATES. NOT SURVEY DATA.</text><text x="1092" y="499" text-anchor="end" fill="#a32a38" font-size="16" font-weight="800" font-family="Arial,Helvetica,sans-serif">KERSIVO / INSIGHTS</text></svg>