<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">A practical review request habit</title><desc id="d">One link, ask every client, send the request after the cut, and accept honest feedback.</desc><rect width="1200" height="500" fill="#101318"/><text x="58" y="78" fill="#e45763" font-size="18" font-weight="800" font-family="Arial,Helvetica,sans-serif" letter-spacing="3">THE HABIT THAT HOLDS UP</text><text x="58" y="142" fill="#f5f1eb" font-size="47" font-weight="800" font-family="Arial,Helvetica,sans-serif">Build a routine, not a review drive.</text><g font-family="Arial,Helvetica,sans-serif"><rect x="58" y="195" width="250" height="227" rx="8" fill="#242932"/><rect x="329" y="195" width="250" height="227" rx="8" fill="#242932"/><rect x="600" y="195" width="250" height="227" rx="8" fill="#242932"/><rect x="871" y="195" width="271" height="227" rx="8" fill="#242932"/><text x="86" y="240" font-size="23" font-weight="800" fill="#e95b67">01</text><text x="357" y="240" font-size="23" font-weight="800" fill="#e95b67">02</text><text x="628" y="240" font-size="23" font-weight="800" fill="#e95b67">03</text><text x="899" y="240" font-size="23" font-weight="800" fill="#e95b67">04</text><text x="86" y="302" font-size="28" font-weight="800" fill="#f6f2ed">One link,</text><text x="86" y="340" font-size="28" font-weight="800" fill="#f6f2ed">everywhere.</text><text x="357" y="302" font-size="28" font-weight="800" fill="#f6f2ed">Ask every</text><text x="357" y="340" font-size="28" font-weight="800" fill="#f6f2ed">client.</text><text x="628" y="302" font-size="28" font-weight="800" fill="#f6f2ed">Ask after</text><text x="628" y="340" font-size="28" font-weight="800" fill="#f6f2ed">the moment.</text><text x="899" y="302" font-size="28" font-weight="800" fill="#f6f2ed">Accept honest</text><text x="899" y="340" font-size="28" font-weight="800" fill="#f6f2ed">feedback.</text><text x="58" y="470" font-size="15" fill="#acb0b8" letter-spacing="2">KERSIVO / INSIGHTS</text></g></svg>