<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Two rulebooks for customer reviews</title><desc id="d">UK consumer law bans concealed incentivised reviews. Google's policies prohibit review incentives even when disclosed. Ask everyone, offer nothing.</desc><rect width="1200" height="660" fill="#101318"/><path d="M0 0h1200v8H0z" fill="#d72638"/><text x="64" y="78" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#e65967">THE RULES AT A GLANCE</text><text x="64" y="138" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" fill="#f2f0ea">One review. Two rulebooks.</text><rect x="64" y="179" width="522" height="331" rx="12" fill="#20252b"/><rect x="614" y="179" width="522" height="331" rx="12" fill="#20252b"/><rect x="88" y="209" width="48" height="4" fill="#e24f5c"/><rect x="638" y="209" width="48" height="4" fill="#e24f5c"/><text x="88" y="258" fill="#b8bdc5" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="3">01  /  UK CONSUMER LAW</text><text x="88" y="328" fill="#f6f2eb" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700">Concealed incentives</text><text x="88" y="368" fill="#f6f2eb" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700">are banned.</text><text x="88" y="437" fill="#c4c6cb" font-size="20" font-family="Arial,Helvetica,sans-serif">Disclosed incentives are not</text><text x="88" y="468" fill="#c4c6cb" font-size="20" font-family="Arial,Helvetica,sans-serif">automatically lawful.</text><text x="638" y="258" fill="#b8bdc5" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="3">02  /  GOOGLE POLICY</text><text x="638" y="328" fill="#f6f2eb" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700">No review incentives.</text><text x="638" y="368" fill="#f6f2eb" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700">Even when disclosed.</text><text x="638" y="437" fill="#c4c6cb" font-size="20" font-family="Arial,Helvetica,sans-serif">No selective requests or</text><text x="638" y="468" fill="#c4c6cb" font-size="20" font-family="Arial,Helvetica,sans-serif">staff review targets.</text><path d="M64 546H1136" stroke="#4a4e56"/><text x="64" y="602" fill="#f2f0ea" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800">ASK EVERYONE.</text><text x="382" y="602" fill="#e55965" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800">OFFER NOTHING.</text><text x="1136" y="602" text-anchor="end" fill="#989ea8" font-size="16" font-family="Arial,Helvetica,sans-serif">KERSIVO / INSIGHTS</text></svg>