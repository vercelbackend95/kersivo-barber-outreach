<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">Why a reduced multiplier did not guarantee a lower bill</title><desc id="d">Illustrative English barbershop at 30000 pounds unchanged rateable value: 8982 in 2025/26, 11760 in 2026/27 before support and 10329.30 after eligible supporting small business relief.</desc><rect width="1200" height="750" rx="24" fill="#111215"/><text x="53" y="58" fill="#ff3333" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">KERSIVO INSIGHTS  /  SHOP ECONOMICS</text><text x="53" y="125" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="750">Lower tax rate. Higher bill?</text><text x="53" y="167" fill="#b7bdc3" font-family="Arial,sans-serif" font-size="21">One hypothetical shop with £30,000 rateable value.</text><rect x="53" y="224" width="349" height="317" rx="16" fill="#f6f4f0"/><text x="78" y="279" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#535961">2025/26</text><text x="78" y="364" font-family="Arial,sans-serif" font-size="53" font-weight="750" fill="#24282d">£8,982</text><line x1="78" x2="376" y1="402" y2="402" stroke="#d9d6d0"/><text x="78" y="450" font-family="Arial,sans-serif" font-size="19" fill="#444b52">40% relief applied</text><rect x="426" y="224" width="349" height="317" rx="16" fill="#f6f4f0"/><text x="451" y="279" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#535961">2026/27</text><text x="451" y="364" font-family="Arial,sans-serif" font-size="53" font-weight="750" fill="#b9232b">£11,760</text><line x1="451" x2="749" y1="402" y2="402" stroke="#d9d6d0"/><text x="451" y="450" font-family="Arial,sans-serif" font-size="19" fill="#444b52">Before the relief cap</text><rect x="799" y="224" width="349" height="317" rx="16" fill="#f6f4f0"/><text x="824" y="279" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#535961">2026/27 capped</text><text x="824" y="364" font-family="Arial,sans-serif" font-size="45" font-weight="750" fill="#24282d">£10,329.30</text><line x1="824" x2="1122" y1="402" y2="402" stroke="#d9d6d0"/><text x="824" y="450" font-family="Arial,sans-serif" font-size="19" fill="#444b52">Supporting Small Business</text><rect x="53" y="587" width="1096" height="78" fill="#24282d" rx="13"/><text x="84" y="638" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="750">2026/27 increase after support: <tspan fill="#ff4343">+£1,347.30</tspan></text><text x="53" y="714" fill="#b6bbc2" font-family="Arial,sans-serif" font-size="18">England only. Illustrative; real bills depend on rateable value, eligibility and council relief.</text></svg>