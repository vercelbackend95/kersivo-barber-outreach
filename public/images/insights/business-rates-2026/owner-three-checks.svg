<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="t d"><title id="t">Three business rates checks for barbershop owners</title><desc id="d">Check correct RHL multiplier, Small Business Rate Relief where eligible, and Valuation Office rateable value. Figures apply to England 2026/27, eligibility varies.</desc><rect width="1200" height="735" rx="24" fill="#111215"/><text x="54" y="60" fill="#ff3333" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">KERSIVO INSIGHTS / OWNER'S DESK</text><text x="54" y="125" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="750">Three things to check on your bill</text><text x="54" y="166" fill="#b4bbc1" font-family="Arial,sans-serif" font-size="21">England 2026/27. Takes ten minutes to start.</text><rect x="54" y="216" width="349" height="375" rx="17" fill="#f6f4f0"/><text x="82" y="281" font-family="Arial,sans-serif" font-size="52" font-weight="750" fill="#d92731">01</text><text x="82" y="338" font-family="Arial,sans-serif" font-size="27" font-weight="750" fill="#1d2228">MULTIPLIER</text><line x1="82" x2="377" y1="369" y2="369" stroke="#d4d4d1"/><text x="82" y="430" font-family="Arial,sans-serif" font-size="31" font-weight="750" fill="#9a2730">38.2p</text><text x="82" y="475" font-family="Arial,sans-serif" font-size="18" fill="#555d64">RHL below £51k RV</text><text x="82" y="514" font-family="Arial,sans-serif" font-size="17" fill="#555d64">Plus supplement if applicable</text><rect x="427" y="216" width="349" height="375" rx="17" fill="#f6f4f0"/><text x="455" y="281" font-family="Arial,sans-serif" font-size="52" font-weight="750" fill="#d92731">02</text><text x="455" y="338" font-family="Arial,sans-serif" font-size="27" font-weight="750" fill="#1d2228">RELIEF</text><line x1="455" x2="750" y1="369" y2="369" stroke="#d4d4d1"/><text x="455" y="430" font-family="Arial,sans-serif" font-size="31" font-weight="750" fill="#9a2730">Up to 100%</text><text x="455" y="475" font-family="Arial,sans-serif" font-size="18" fill="#555d64">Single property / RV ≤ £12k</text><text x="455" y="514" font-family="Arial,sans-serif" font-size="17" fill="#555d64">Tapers to £15k</text><rect x="800" y="216" width="349" height="375" rx="17" fill="#f6f4f0"/><text x="828" y="281" font-family="Arial,sans-serif" font-size="52" font-weight="750" fill="#d92731">03</text><text x="828" y="338" font-family="Arial,sans-serif" font-size="27" font-weight="750" fill="#1d2228">VALUATION</text><line x1="828" x2="1123" y1="369" y2="369" stroke="#d4d4d1"/><text x="828" y="430" font-family="Arial,sans-serif" font-size="31" font-weight="750" fill="#9a2730">VOA check</text><text x="828" y="475" font-family="Arial,sans-serif" font-size="18" fill="#555d64">Floor area and rent evidence</text><text x="828" y="514" font-family="Arial,sans-serif" font-size="17" fill="#555d64">Correct inaccurate records</text><text x="54" y="653" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">Council: multipliers &amp; relief. VOA: rateable value.</text><text x="54" y="700" fill="#b8bec5" font-family="Arial,sans-serif" font-size="18">Always check the exact relief eligibility and figures on your own assessment.</text></svg>