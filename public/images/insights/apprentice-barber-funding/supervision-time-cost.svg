<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">The real cost of mentoring an apprentice barber</title><desc id="d">Illustrative lost capacity: 3 hours of paid chair work displaced per week, at £32 contribution per hour, equals £96 weekly and £4,608 per 48 working weeks. Compare up to £2,000 hiring and £1,000 extra payment, both conditional.</desc><rect width="1200" height="720" rx="24" fill="#121417"/>
<text x="54" y="60" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#ff3535">KERSIVO INSIGHTS / SUPERVISION COST</text>
<text x="54" y="126" font-family="Arial,sans-serif" font-size="47" font-weight="750" fill="#fff">The cost that isn't on the payslip.</text>
<text x="54" y="166" font-family="Arial,sans-serif" font-size="21" fill="#b8bec6">Hypothetical paid work displaced by a senior barber's coaching time.</text>
<rect x="54" y="215" width="258" height="220" rx="16" fill="#f5f4f0"/><text x="76" y="317" font-family="Arial,sans-serif" font-size="57" font-weight="800" fill="#24292e">3</text><text x="76" y="370" font-family="Arial,sans-serif" font-size="19" fill="#50565f">hours/week</text><rect x="332" y="215" width="258" height="220" rx="16" fill="#f5f4f0"/><text x="354" y="317" font-family="Arial,sans-serif" font-size="57" font-weight="800" fill="#24292e">£32</text><text x="354" y="370" font-family="Arial,sans-serif" font-size="19" fill="#50565f">contribution/hour</text><rect x="610" y="215" width="258" height="220" rx="16" fill="#f5f4f0"/><text x="632" y="317" font-family="Arial,sans-serif" font-size="57" font-weight="800" fill="#24292e">£96</text><text x="632" y="370" font-family="Arial,sans-serif" font-size="19" fill="#50565f">per week</text><rect x="888" y="215" width="258" height="220" rx="16" fill="#f5f4f0"/><text x="910" y="317" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#c52830">£4,608</text><text x="910" y="370" font-family="Arial,sans-serif" font-size="19" fill="#50565f">over 48 weeks</text>
<rect x="54" y="492" width="1092" height="104" rx="15" fill="#292c31"/>
<text x="82" y="534" font-family="Arial,sans-serif" font-size="21" fill="#e9ebef">Potential support where eligible</text>
<text x="82" y="572" font-family="Arial,sans-serif" font-size="29" font-weight="750" fill="#fff">Up to £2,000 hiring payment + £1,000 additional payment</text>
<text x="54" y="646" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Only foregone paid chair hours are counted as lost contribution.</text>
<text x="54" y="686" font-family="Arial,sans-serif" font-size="17" fill="#abb3ba">Example, not a prediction. Paid training, pensions and output must be considered separately.</text></svg>