<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">Annual wage comparison apprentice vs qualified barber</title><desc id="d">Hypothetical 37.5 hours a week paid for 52 weeks: apprentice under 19 gross wages £15,600, employer NI £0; qualified barber 21 plus £24,784.50 gross and £2,967.68 employer NI before Employment Allowance. Pension costs excluded.</desc><rect width="1200" height="750" rx="24" fill="#121417"/>
<text x="54" y="60" font-family="Arial,sans-serif" font-size="18" fill="#ff3535" letter-spacing="3" font-weight="700">KERSIVO INSIGHTS / PEOPLE &amp; PAY</text>
<text x="54" y="128" font-family="Arial,sans-serif" font-size="47" font-weight="750" fill="#fff">Lower wages. Different output.</text>
<text x="54" y="171" font-family="Arial,sans-serif" font-size="21" fill="#bec4cb">Illustrative year: 37.5 paid hours × 52 weeks, April 2026 rates.</text>
<rect x="54" y="217" width="520" height="320" rx="17" fill="#f5f4f0"/>
<rect x="626" y="217" width="520" height="320" rx="17" fill="#f5f4f0"/>
<text x="82" y="267" font-family="Arial,sans-serif" font-size="22" font-weight="750" fill="#6a7077">APPRENTICE UNDER 19</text>
<text x="654" y="267" font-family="Arial,sans-serif" font-size="22" font-weight="750" fill="#6a7077">QUALIFIED BARBER 21+</text>
<text x="82" y="349" font-family="Arial,sans-serif" font-size="62" font-weight="800" fill="#22272c">£15,600</text>
<text x="654" y="349" font-family="Arial,sans-serif" font-size="62" font-weight="800" fill="#22272c">£24,784.50</text>
<text x="82" y="392" font-family="Arial,sans-serif" font-size="20" fill="#4f555e">£8.00 / hour</text>
<text x="654" y="392" font-family="Arial,sans-serif" font-size="20" fill="#4f555e">£12.71 / hour</text>
<line x1="82" x2="548" y1="426" y2="426" stroke="#d5d2cd"/><line x1="654" x2="1120" y1="426" y2="426" stroke="#d5d2cd"/>
<text x="82" y="466" font-family="Arial,sans-serif" font-size="20" fill="#414850">Employer NI: <tspan font-weight="750" fill="#2f7658">£0</tspan></text>
<text x="654" y="466" font-family="Arial,sans-serif" font-size="20" fill="#414850">Employer NI before EA: <tspan font-weight="750" fill="#b32c35">£2,967.68</tspan></text>
<text x="82" y="501" font-family="Arial,sans-serif" font-size="17" fill="#5b6169">Under-25 apprentice exemption</text>
<text x="654" y="501" font-family="Arial,sans-serif" font-size="17" fill="#5b6169">May be covered by Employment Allowance</text>
<rect x="54" y="586" width="1092" height="88" rx="14" fill="#2a2d32"/>
<text x="82" y="640" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#fff">Wage costs alone cannot measure apprenticeship value.</text>
<text x="54" y="712" font-family="Arial,sans-serif" font-size="17" fill="#b5bbc2">Illustrative UK payroll example; excludes pension, other costs and relative service productivity.</text></svg>